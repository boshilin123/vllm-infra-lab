apiVersion: v1
kind: Service
metadata:
  name: qwen3-8b
  namespace: vllm-infra-lab
  labels:
    app.kubernetes.io/name: qwen3-8b
    app.kubernetes.io/component: inference-server
    app.kubernetes.io/part-of: vllm-infra-lab
spec:
  # Phase 1 仅供集群内部和 kubectl port-forward 访问，不直接暴露公网端口。
  type: ClusterIP
  # Service 根据标签寻找后端 Pod；Pod 重建后 IP 改变也不影响访问地址。
  selector:
    app.kubernetes.io/name: qwen3-8b
  ports:
    - name: http
      port: 8000
      targetPort: http
      protocol: TCP
