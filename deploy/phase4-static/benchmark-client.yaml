apiVersion: v1
kind: Pod
metadata:
  name: phase4-benchmark-client
  namespace: vllm-infra-lab
  labels:
    app.kubernetes.io/name: phase4-benchmark-client
    app.kubernetes.io/component: benchmark-client
    app.kubernetes.io/part-of: vllm-infra-lab
spec:
  # 仓库和本地 Tokenizer 只存在 qhvgpu1。
  nodeSelector:
    kubernetes.io/hostname: qhvgpu1
  restartPolicy: Never
  containers:
    - name: client
      image: vllm/vllm-openai:v0.9.1
      imagePullPolicy: IfNotPresent
      command:
        - /bin/bash
        - -lc
        - sleep infinity
      workingDir: /workspace
      env:
        - name: HF_HUB_OFFLINE
          value: "1"
        - name: TRANSFORMERS_OFFLINE
          value: "1"
        # 镜像内没有宿主机 UID 1000 的 passwd 条目；显式身份与缓存目录
        # 避免 PyTorch getpass.getuser() 查询失败，同时保持非 root 运行。
        - name: USER
          value: benchmark
        - name: LOGNAME
          value: benchmark
        - name: HOME
          value: /tmp
        - name: XDG_CACHE_HOME
          value: /tmp/.cache
        - name: TORCHINDUCTOR_CACHE_DIR
          value: /tmp/torchinductor
      resources:
        requests:
          cpu: 250m
          memory: 512Mi
        limits:
          cpu: "1"
          memory: 2Gi
      securityContext:
        allowPrivilegeEscalation: false
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
      volumeMounts:
        - name: repository
          mountPath: /workspace
        - name: model
          mountPath: /models/Qwen3-8B
          readOnly: true
        - name: temp
          mountPath: /tmp
  volumes:
    - name: repository
      hostPath:
        path: /home/qhadmin/boshi/vllm/vllm-infra-lab
        type: Directory
    - name: model
      hostPath:
        path: /home/qhadmin/boshi/vllm/models/Qwen3-8B
        type: Directory
    - name: temp
      emptyDir:
        sizeLimit: 2Gi
